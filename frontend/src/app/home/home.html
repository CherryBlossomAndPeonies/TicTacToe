<main class="home-screen">
	<section class="game-menu" aria-labelledby="game-title">
		<div class="brand-lockup">
			<span class="brand-mark" aria-hidden="true">X O</span>
			<h1 id="game-title">Tic Tac Toe</h1>
		</div>

		<div class="board-preview" aria-label="Tic tac toe board preview">
			<div class="board-cell cell-x">X</div>
			<div class="board-cell cell-o">O</div>
			<div class="board-cell cell-x">X</div>
			<div class="board-cell cell-o">O</div>
			<div class="board-cell cell-x">X</div>
			<div class="board-cell cell-o">O</div>
			<div class="board-cell cell-x">X</div>
			<div class="board-cell cell-o">O</div>
			<div class="board-cell cell-x">X</div>
			<span class="win-line" aria-hidden="true"></span>
		</div>

		<div class="menu-actions" aria-label="Game modes">
			<a class="menu-button" routerLink="/gameboard" [queryParams]="{ mode: 'Two Player' }">Two Player</a>
			<a class="menu-button" routerLink="/gameboard" [queryParams]="{ mode: 'Single Player' }">Single Player</a>
		</div>
	</section>
</main>
